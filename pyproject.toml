[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raven-remote"
version = "0.1.0"
description = "LAN-only remote control for your own PCs and Macs: screen, mouse, keyboard, sleep and shutdown."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PySide6-Essentials>=6.6",
    "websockets>=13.0",
    "mss>=9.0",
    "pynput>=1.7.6",
    "Pillow>=10.0",
    "cryptography>=41.0",
    "zeroconf>=0.131",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pyinstaller>=6.0"]

[project.scripts]
raven = "raven.cli:main"

[tool.setuptools.packages.find]
include = ["raven*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
